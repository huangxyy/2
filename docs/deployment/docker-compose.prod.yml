version: '3.8'

services:
  frontend:
    image: ${DOCKER_REGISTRY}/htb-academy-frontend:${TAG:-latest}
    restart: unless-stopped
    networks:
      - htb-academy-network
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL}

  backend:
    image: ${DOCKER_REGISTRY}/htb-academy-backend:${TAG:-latest}
    restart: unless-stopped
    networks:
      - htb-academy-network
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - jwt_secret
      - cookie_secret

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    networks:
      - htb-academy-network
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    networks:
      - htb-academy-network
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.20-alpine
    restart: unless-stopped
    networks:
      - htb-academy-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus:v2.37.0
    restart: unless-stopped
    networks:
      - htb-academy-network
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:9.0.0
    restart: unless-stopped
    networks:
      - htb-academy-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana

networks:
  htb-academy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

secrets:
  jwt_secret:
    file: jwt_secret.key
  cookie_secret:
    file: cookie_secret.key