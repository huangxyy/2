# ... 之前的服务配置 ...

services:
  backend:
    # ... 其他配置 ...
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

  frontend:
    # ... 其他配置 ...
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  postgres:
    # ... 其他配置 ...
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256

  redis:
    # ... 其他配置 ...
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--tls-port", "6379", "--tls-cert-file", "/etc/redis/redis.crt", "--tls-key-file", "/etc/redis/redis.key", "--tls-ca-cert-file", "/etc/redis/ca.crt"]