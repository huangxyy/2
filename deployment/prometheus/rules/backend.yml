groups:
  - name: backend
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: High HTTP error rate
          description: "{{ $labels.service }} is experiencing high error rate (> 10%)"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High response time
          description: "{{ $labels.service }} has 95th percentile latency above 2s"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / container_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High memory usage
          description: "Container {{ $labels.container }} is using more than 90% of memory limit"